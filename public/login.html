<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Phantizy Productions</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/icon-64.png">
<link rel="apple-touch-icon" href="/icon-180.png">
</head>
<body>
<div class="login-shell">
  <form class="login-card" id="loginForm">
    <img class="brand" src="/logo.png" alt="Phantizy Productions">
    <p>Promoter Portal</p>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <div class="err-msg" id="err"></div>
    <button class="btn" style="width:100%;justify-content:center" id="btn">Sign in</button>
  </form>
</div>
<script>
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.value, password: password.value }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Sign in failed');
    const next = new URLSearchParams(location.search).get('next');
    location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
  } catch (ex) {
    err.textContent = ex.message;
    btn.disabled = false;
  }
};
</script>
</body>
</html>
