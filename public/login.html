<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Phantizy Productions</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%235B2A86%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Arial%27 font-weight=%27bold%27 font-size=%2720%27 fill=%27white%27 text-anchor=%27middle%27%3EP%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="login-shell">
  <form class="login-card" id="loginForm">
    <div class="brand">PHANTIZY</div>
    <p>Productions · Promoter Portal</p>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <div class="err-msg" id="err"></div>
    <button class="btn" style="width:100%;justify-content:center" id="btn">Sign in</button>
  </form>
</div>
<script>
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.value, password: password.value }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Sign in failed');
    const next = new URLSearchParams(location.search).get('next');
    location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
  } catch (ex) {
    err.textContent = ex.message;
    btn.disabled = false;
  }
};
</script>
</body>
</html>
