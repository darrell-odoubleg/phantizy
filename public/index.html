<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offers · Phantizy Productions</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%235B2A86%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Arial%27 font-weight=%27bold%27 font-size=%2720%27 fill=%27white%27 text-anchor=%27middle%27%3EP%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="wrap">
  <div class="head-row">
    <div><h1>Offers</h1><p class="subtitle">Every offer, its paperwork, and where the checklist stands.</p></div>
    <a class="btn" href="/offer.html">+ New offer</a>
  </div>

  <div class="card">
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search artist, venue, city, agency…">
    </div>
    <div class="filters" id="filters"></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Date</th><th>Artist</th><th class="hide-sm">Venue</th><th class="hide-sm">Guarantee</th>
          <th>Status</th><th class="hide-sm">Docs</th><th>Checklist</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>No offers yet. <a href="/offer.html">Create the first one.</a></div>
  </div>
</div>
<script src="/fields.js"></script>
<script src="/app.js"></script>
<script>
const FILTERS = [['', 'All'], ['draft', 'Draft'], ['sent', 'Sent'], ['accepted', 'Accepted'], ['completed', 'Completed'], ['declined', 'Declined'], ['cancelled', 'Cancelled']];
let status = sessionStorage.getItem('pf_status') || '';
let timer;

function renderFilters() {
  document.getElementById('filters').innerHTML = FILTERS.map(([k, l]) =>
    `<button data-s="${k}" class="${k === status ? 'active' : ''}">${l}</button>`).join('');
}
document.getElementById('filters').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  status = b.dataset.s;
  try { sessionStorage.setItem('pf_status', status); } catch {}
  renderFilters(); load();
};
document.getElementById('q').oninput = () => { clearTimeout(timer); timer = setTimeout(load, 200); };

async function load() {
  const q = document.getElementById('q').value.trim();
  const params = new URLSearchParams();
  if (status) params.set('status', status);
  if (q) params.set('q', q);
  const rows = await api('/offers?' + params);
  document.getElementById('empty').hidden = rows.length > 0 || q || status;
  document.getElementById('rows').innerHTML = rows.length ? rows.map(r => {
    const pct = r.checklist_total ? Math.round(100 * r.checklist_done / r.checklist_total) : 0;
    return `<tr class="click" data-id="${r.id}">
      <td>${esc(fmtDate(r.event_date)) || '<span style="color:var(--dim)">TBD</span>'}</td>
      <td><strong>${esc(r.artist_name)}</strong>${r.event_name ? `<div style="font-size:12px;color:var(--dim)">${esc(r.event_name)}</div>` : ''}</td>
      <td class="hide-sm">${esc(r.venue_name || '')}${r.venue_city ? `<div style="font-size:12px;color:var(--dim)">${esc([r.venue_city, r.venue_state].filter(Boolean).join(', '))}</div>` : ''}</td>
      <td class="hide-sm">${esc(money(r.guarantee))}</td>
      <td>${badge(r.status)}</td>
      <td class="hide-sm"><span class="pill ${r.contract_count ? '' : 'off'}" title="Contracts">Contract</span><span class="pill ${r.rider_count ? '' : 'off'}" title="Riders">Rider</span></td>
      <td><div class="progress"><div class="bar"><span style="width:${pct}%"></span></div>${r.checklist_done}/${r.checklist_total}</div></td>
    </tr>`;
  }).join('') : (q || status ? '<tr><td colspan="7" class="empty">No offers match.</td></tr>' : '');
}
document.getElementById('rows').onclick = (e) => {
  const tr = e.target.closest('tr[data-id]');
  if (tr) location.href = '/offer.html?id=' + tr.dataset.id;
};

initNav('offers').then(() => { renderFilters(); load(); });
</script>
</body>
</html>
